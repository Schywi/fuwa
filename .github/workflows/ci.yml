name: CI Pipeline

# Orchestrator — wires reusable workflows into a staged pipeline.
#
# Flow:
#   push to ui-redesign-sqlite-implementation-infra-merge
#     │
#     ├── gatekeeper (gitleaks, merge markers, whitespace, markdown lint)
#     │
#     ├── ci ─────────────────────┐  (parallel)
#     │   ├── compile-check       │
#     │   ├── lint                │
#     │   ├── unit                │
#     │   └── integration         │
#     │                          │
#     └── docker ─────────────────┘
#         ├── build image
#         ├── boot container
#         └── health smoke
#               │
#               └── infra (only if docker passes)
#                   ├── tfsec
#                   ├── terraform apply
#                   ├── ansible bootstrap
#                   ├── terratest
#                   └── terraform destroy (always)

on:
  push:
    branches: [ui-redesign-sqlite-implementation-infra-merge]
  pull_request:
    branches: [ui-redesign-sqlite-implementation-infra-merge]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── STAGE 0 · GATEKEEPER ──────────────────────────────────────────
  gatekeeper:
    uses: ./.github/workflows/_gatekeeper.yml

  # ── STAGE 1 · CI + DOCKER (parallel) ──────────────────────────────
  ci:
    needs: gatekeeper
    uses: ./.github/workflows/_ci.yml

  docker:
    needs: gatekeeper
    uses: ./.github/workflows/_docker-test.yml

  # ── STAGE 2 · INFRA GATE (only if docker passes) ──────────────────
  infra:
    needs: docker
    uses: ./.github/workflows/_infra-test.yml
    secrets: inherit
