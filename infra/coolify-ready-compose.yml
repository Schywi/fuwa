name: docker-compose

services:
  # ══════════════════════════════════════════════════════════════════
  # APP: OpenResty (from app.dev.yml)
  # ══════════════════════════════════════════════════════════════════
  openresty:
    build:
      context: ..
      dockerfile: infra/Dockerfile.openresty
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ..:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FUWA_DB_PATH: /app/.fuwa-dev/sqlite-local.db
      FUWA_SIGNOZ_OTLP_URL: http://vector-router:4318/v1/traces
      FUWA_VECTOR_URL: http://vector-router:8687/
      PORT: ${PORT:-8080}
    working_dir: /app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-8080}/"]
      interval: 5s
      retries: 6
      start_period: 5s
      timeout: 3s
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════
  # TELEMETRY: Vector + VictoriaMetrics (from telemetry.yml)
  # ══════════════════════════════════════════════════════════════════
  vector-router:
    image: timberio/vector:0.57.0-alpine
    command:
      - "--config-toml"
      - "/etc/vector/vector.toml"
    ports:
      - "8686:8686"
      - "8687:8687"
    volumes:
      - ./docker-compose/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      victoriametrics:
        condition: service_started
      signoz-ingester:
        condition: service_started
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    ports:
      - "8428:8428"
    command:
      - "--retentionPeriod=14d"
      - "--storageDataPath=/vmetrics-data"
    volumes:
      - vm_data:/vmetrics-data
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════
  # SIGNOZ STACK (from signoz.yml)
  # ══════════════════════════════════════════════════════════════════
  signoz:
    image: signoz/signoz-community:latest
    environment:
      SIGNOZ_SQLSTORE_PROVIDER: sqlite
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_GLOBAL_EXTERNAL__URL: ${SIGNOZ_GLOBAL_EXTERNAL__URL:-http://localhost:8080/dash/signoz}
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_TOKENIZER_JWT_SECRET:-FuwaDevJwtSecret2026!}
      SIGNOZ_USER_ROOT_ENABLED: "true"
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_USER_ROOT_EMAIL:-admin@fuwa.local}
      SIGNOZ_USER_ROOT_PASSWORD: ${SIGNOZ_USER_ROOT_PASSWORD:-FuwaDemoAdmin1!}
      SIGNOZ_USER_ROOT_ORG_NAME: ${SIGNOZ_USER_ROOT_ORG_NAME:-default}
      SIGNOZ_IDENTN_IMPERSONATION_ENABLED: "true"
      SIGNOZ_IDENTN_TOKENIZER_ENABLED: "false"
      SIGNOZ_IDENTN_APIKEY_ENABLED: "false"
    volumes:
      - signoz_meta:/var/lib/signoz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  signoz-bootstrap:
    build:
      context: ..
      dockerfile: infra/docker-compose/signoz-bootstrap.Dockerfile
    environment:
      SIGNOZ_URL: http://signoz:8080/dash/signoz
      SEEDS_DIR: /seeds/dashboards
      MARKER_FILE: /var/lib/signoz-bootstrap/.seeded
    volumes:
      - signoz_bootstrap_marker:/var/lib/signoz-bootstrap
      - ./signoz-seeds:/seeds:ro
    depends_on:
      signoz:
        condition: service_healthy
    restart: on-failure

  signoz-ingester:
    image: signoz/signoz-otel-collector:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml \
          --manager-config=/etc/opamp-config.yaml \
          --copy-path=/var/tmp/collector-config.yaml
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker-compose/signoz/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./docker-compose/signoz/opamp.yaml:/etc/opamp-config.yaml:ro
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: unless-stopped

  signoz-migrator:
    image: signoz/signoz-otel-collector:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: on-failure

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config-0-0.yaml
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - signoz_ch_data:/var/lib/clickhouse
      - ./docker-compose/signoz/clickhouse-config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    depends_on:
      signoz-keeper:
        condition: service_healthy
    restart: unless-stopped

  signoz-keeper:
    image: clickhouse/clickhouse-keeper:25.12.5
    entrypoint: ["/usr/bin/clickhouse-keeper", "--config-file=/etc/clickhouse-keeper/keeper.yaml"]
    volumes:
      - signoz_keeper_data:/var/lib/clickhouse-keeper
      - ./docker-compose/signoz/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-h", "localhost", "-p", "9181", "-q", "ls"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════
  # LOAD TESTING: continuous traffic (from load.yml)
  # ══════════════════════════════════════════════════════════════════
  loadtest-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    command:
      - traces
      - --otlp-endpoint=vector-router:4318
      - --otlp-http
      - --otlp-insecure
      - --duration=5m
      - --rate=20
      - --workers=1
      - --child-spans=2
      - --service=loadtest
      - --otlp-attributes
      - 'source="loadtest"'
    depends_on:
      vector-router:
        condition: service_started
    restart: unless-stopped

  loadtest-fuwa:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - |
        while true; do
          for i in $$(seq 1 10); do
            curl -s -o /dev/null http://openresty:${PORT:-8080}/?_src=loadtest &
          done
          wait
          sleep 3
        done
    depends_on:
      openresty:
        condition: service_healthy
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════
  # K6 STRESS TESTING (from k6.yml)
  # ══════════════════════════════════════════════════════════════════
  k6-ramp:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=ramp
      - --env
      - BASE_URL=http://openresty:${PORT:-8080}
      - /scripts/fuwa-stress.js
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_healthy

  k6-spike:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=spike
      - --env
      - BASE_URL=http://openresty:${PORT:-8080}
      - /scripts/fuwa-stress.js
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_healthy

  k6-soak:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=soak
      - --env
      - BASE_URL=http://openresty:${PORT:-8080}
      - /scripts/fuwa-stress.js
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_healthy

  k6-edges:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=edges
      - --env
      - BASE_URL=http://openresty:${PORT:-8080}
      - /scripts/fuwa-stress.js
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_healthy

volumes:
  vm_data:
  signoz_meta:
  signoz_ch_data:
  signoz_keeper_data:
  signoz_bootstrap_marker:
