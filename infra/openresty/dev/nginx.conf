worker_processes auto;
events { worker_connections 1024; }

http {
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_referer $root_asset_upstream {
    default fuwa:8080;
    "~^https?://[^/]+/dash/hubble/" hubble-ui:30080;
  }

  map $http_referer $api_upstream_host {
    default signoz:8080;
    "~^https?://[^/]+/dash/hubble/" hubble-ui:30080;
  }

  map $http_referer $api_upstream_prefix {
    default /dash/signoz/api/;
    "~^https?://[^/]+/dash/hubble/" /api/;
  }

  server {
    listen 80;

    # ── Fuwa app ────────────────────────────────────────────
    location / {
      proxy_pass http://fuwa:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SigNoz dashboard (landing redirect) ──────────────────
    location = /dash/signoz/ {
      return 302 http://$http_host/dash/signoz/dashboards;
    }

    # ── SigNoz dashboard ────────────────────────────────────
    location /dash/signoz/ {
      set $signoz_upstream signoz:8080;
      proxy_pass http://$signoz_upstream;
      proxy_set_header Host $host;
    }

    # ── SigNoz API (SPA makes absolute /api/ calls) ────────
    location /api/ {
      rewrite ^/api/?(.*)$ $api_upstream_prefix$1 break;
      proxy_pass http://$api_upstream_host;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Root-mounted Hubble assets (selected by referer) ────
    location ~* ^/(bundle\.main\.[^/]+\.(js|css|map)|favicon[^/]*\.(png|ico))$ {
      proxy_pass http://$root_asset_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ── Hubble UI API (subpath-aware proxy) ──────────────────
    location /dash/hubble/api/ {
      set $hubble_upstream hubble-ui:30080;
      rewrite ^/dash/hubble/api(/.*)$ /api$1 break;
      proxy_pass http://$hubble_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Hubble UI entry HTML (rewrite base href for basename) ──
    location = /__hubble_root__ {
      internal;
      set $hubble_upstream hubble-ui:30080;
      proxy_pass http://$hubble_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /dash/hubble {
      return 302 http://$http_host/dash/hubble/;
    }

    location = /dash/hubble/ {
      default_type text/html;
      content_by_lua_block {
        local res = ngx.location.capture("/__hubble_root__")
        if not res then
          ngx.status = 502
          ngx.say("failed to fetch Hubble entrypoint")
          return
        end

        ngx.status = res.status
        if res.status ~= 200 then
          ngx.print(res.body or "")
          return
        end

        ngx.header["Content-Type"] = res.header["Content-Type"] or "text/html"
        local body = res.body or ""
        body = body:gsub('href="/"', 'href="/dash/hubble/"', 1)
        ngx.print(body)
      }
    }

    # ── Hubble UI assets and subpaths ────────────────────────
    location /dash/hubble/ {
      set $hubble_upstream hubble-ui:30080;
      rewrite ^/dash/hubble(/.*)$ $1 break;
      proxy_pass http://$hubble_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # ── VictoriaMetrics ─────────────────────────────────────
    location /dash/vmetrics/ {
      set $vm_upstream victoriametrics:8428;
      rewrite ^/dash/vmetrics(/.*)$ $1 break;
      proxy_pass http://$vm_upstream;
    }

    # ── ClickHouse Play UI ──────────────────────────────────
    location /dash/clickhouse/ {
      set $ch_upstream clickhouse:8123;
      rewrite ^/dash/clickhouse(/.*)$ $1 break;
      proxy_pass http://$ch_upstream;
    }

    # ── Vector API ──────────────────────────────────────────
    location /dash/vector/ {
      set $vec_upstream vector-router:8686;
      rewrite ^/dash/vector(/.*)$ $1 break;
      proxy_pass http://$vec_upstream;
    }
  }
}
