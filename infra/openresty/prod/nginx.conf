worker_processes auto;

events {
  worker_connections 1024;
}

http {
  lua_package_path "/etc/openresty/lua/?.lua;;";
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  upstream fuwa_backend {
    server fuwa:8080;
    keepalive 32;
  }

  log_format edge_json escape=json
    "{"
      "\"timestamp\":\"$time_iso8601\","
      "\"request_id\":\"$edge_request_id\","
      "\"traceparent\":\"$edge_traceparent\","
      "\"method\":\"$request_method\","
      "\"uri\":\"$request_uri\","
      "\"path\":\"$uri\","
      "\"status\":$status,"
      "\"request_time\":$request_time,"
      "\"upstream_response_time\":\"$upstream_response_time\","
      "\"bytes_sent\":$bytes_sent,"
      "\"remote_addr\":\"$remote_addr\","
      "\"user_agent\":\"$http_user_agent\""
    "}";

  access_log /var/log/openresty/access.jsonl edge_json;
  error_log /dev/stderr warn;

  server {
    listen 8080;

    set $edge_request_id "";
    set $edge_traceparent "";

    access_by_lua_file /etc/openresty/lua/request_context.lua;

    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $edge_request_id;
    proxy_set_header traceparent $edge_traceparent;

    location / {
      proxy_pass http://fuwa_backend;
    }
  }
}
