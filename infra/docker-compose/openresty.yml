services:
  openresty:
    image: openresty/openresty:1.27.1.2-0-alpine
    depends_on:
      fuwa:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ../openresty/dev/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    restart: unless-stopped
