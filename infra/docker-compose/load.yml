services:
  # ── Continuous trace ingestion: OTLP → Vector → Signoz ─────────────
  loadtest-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    command:
      - traces
      - --otlp-endpoint=vector-router:4318
      - --otlp-http
      - --otlp-insecure
      - --duration=5m
      - --rate=20
      - --workers=1
      - --child-spans=2
      - --service=loadtest
      - --otlp-attributes
      - 'source="loadtest"'
    depends_on:
      vector-router:
        condition: service_started
    restart: unless-stopped

  # ── Continuous Fuwa requests (full pipeline: traces + logs + metrics)
  loadtest-fuwa:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - |
        while true; do
          for i in $$(seq 1 10); do
            curl -s -o /dev/null http://openresty:${PORT:-8080}/?_src=loadtest &
          done
          wait
          sleep 3
        done
    depends_on:
      openresty:
        condition: service_healthy
    restart: unless-stopped
