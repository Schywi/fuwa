services:
  openresty:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.openresty
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ../..:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FUWA_DB_PATH: /app/.fuwa-dev/sqlite-local.db
      FUWA_SIGNOZ_OTLP_URL: http://signoz-ingester:4318/v1/traces
      FUWA_UPTRACE_OTLP_URL: ${FUWA_UPTRACE_OTLP_URL:-}
      FUWA_UPTRACE_EMAIL: ${FUWA_UPTRACE_EMAIL:-admin@uptrace.local}
      FUWA_UPTRACE_PASSWORD: ${FUWA_UPTRACE_PASSWORD:-uptrace}
      FUWA_VECTOR_URL: http://vector-router:8687/
      PORT: ${PORT:-8080}
    working_dir: /app
    restart: unless-stopped
