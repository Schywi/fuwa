services:
  signoz:
    image: signoz/signoz-community@sha256:831b17f31452dccd5a6884f108b00bd1a4a7880caeb239899a6c57e072a48e87
    environment:
      SIGNOZ_SQLSTORE_PROVIDER: sqlite
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_GLOBAL_EXTERNAL__URL: ${SIGNOZ_GLOBAL_EXTERNAL__URL:-http://localhost:8080/dash/signoz}
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_TOKENIZER_JWT_SECRET:-FuwaDevJwtSecret2026!}
      SIGNOZ_USER_ROOT_ENABLED: "true"
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_USER_ROOT_EMAIL:-admin@fuwa.local}
      SIGNOZ_USER_ROOT_PASSWORD: ${SIGNOZ_USER_ROOT_PASSWORD:-FuwaDemoAdmin1!}
      SIGNOZ_USER_ROOT_ORG_NAME: ${SIGNOZ_USER_ROOT_ORG_NAME:-default}
      SIGNOZ_IDENTN_IMPERSONATION_ENABLED: "true"
      SIGNOZ_IDENTN_TOKENIZER_ENABLED: "false"
      SIGNOZ_IDENTN_APIKEY_ENABLED: "false"
    volumes:
      - signoz_meta:/var/lib/signoz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  signoz-bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker-compose/signoz-bootstrap.Dockerfile
    environment:
      SIGNOZ_URL: http://signoz:8080/dash/signoz
      SEEDS_DIR: /seeds/dashboards
      MARKER_FILE: /var/lib/signoz-bootstrap/.seeded
    volumes:
      - signoz_bootstrap_marker:/var/lib/signoz-bootstrap
      - ../../infra/signoz-seeds:/seeds:ro
    depends_on:
      signoz:
        condition: service_healthy
    restart: on-failure

  signoz-ingester:
    image: signoz/signoz-otel-collector:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml \
          --manager-config=/etc/opamp-config.yaml \
          --copy-path=/var/tmp/collector-config.yaml
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./signoz/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/opamp.yaml:/etc/opamp-config.yaml:ro
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: unless-stopped

  signoz-migrator:
    image: signoz/signoz-otel-collector:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: on-failure

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    mem_limit: 1g
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config-0-0.yaml
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - signoz_ch_data:/var/lib/clickhouse
      - ./signoz/clickhouse-config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    depends_on:
      signoz-keeper:
        condition: service_healthy
    restart: unless-stopped

  signoz-keeper:
    image: clickhouse/clickhouse-keeper:25.12.5
    entrypoint: ["/usr/bin/clickhouse-keeper", "--config-file=/etc/clickhouse-keeper/keeper.yaml"]
    volumes:
      - signoz_keeper_data:/var/lib/clickhouse-keeper
      - ./signoz/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-h", "localhost", "-p", "9181", "-q", "ls"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
    restart: unless-stopped

volumes:
  signoz_meta:
  signoz_ch_data:
  signoz_keeper_data:
  signoz_bootstrap_marker:
