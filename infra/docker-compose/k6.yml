services:
  # ── k6 stress testing ────────────────────────────────────────────────
  # Scenarios: ramp, spike, soak, edges
  # Script: infra/k6/fuwa-stress.js
  # Tag: all requests carry ?_src=k6_{scenario} for filtering in Signoz

  k6-ramp:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=ramp
      - /scripts/fuwa-stress.js
    volumes:
      - ../../infra/k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_started

  k6-spike:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=spike
      - /scripts/fuwa-stress.js
    volumes:
      - ../../infra/k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_started

  k6-soak:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=soak
      - /scripts/fuwa-stress.js
    volumes:
      - ../../infra/k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_started

  k6-edges:
    image: grafana/k6:latest
    command:
      - run
      - --env
      - SCENARIO=edges
      - /scripts/fuwa-stress.js
    volumes:
      - ../../infra/k6:/scripts:ro
    depends_on:
      openresty:
        condition: service_started
