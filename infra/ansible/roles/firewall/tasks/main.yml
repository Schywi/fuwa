---
# role: firewall — ufw rules for production

- name: Allow SSH
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
  ignore_errors: yes

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow OpenResty app port
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
