# Allow-list for the fuwa pod. Ingress only from the LoadBalancer / cluster
# ingress; egress only to the API server (pod logs), DNS, the observability
# namespace (OTLP traces), and the cluster assistant the drawer proxies to.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fuwa
  namespace: fuwa
  labels:
    app.kubernetes.io/name: fuwa
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: fuwa
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: fuwa
            app.kubernetes.io/name: otel-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # /assistant/* is reverse-proxied by nginx to the assistant Service; without
    # this the proxy connect times out (504) even though the pod can resolve it.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: assistant
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # /argocd/* and /api/* are proxied to argocd-server for the panel. The port
    # is the pod's, not the Service's: argocd-server exposes 80 -> 8080 and
    # Cilium evaluates egress policy after DNAT.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
