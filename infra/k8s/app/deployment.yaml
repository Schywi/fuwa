apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuwa
  namespace: fuwa
  labels:
    app.kubernetes.io/name: fuwa
spec:
  # The runtime owns a single SQLite file and a file watcher, so it is a
  # single-writer service.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fuwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuwa
    spec:
      serviceAccountName: fuwa
      containers:
        - name: fuwa
          # Built by kaniko and pushed to the in-cluster registry (see build.sh).
          image: 127.0.0.1:5000/fuwa:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Enable the cluster-only nginx block (SA CA for API TLS) and drop
            # the TLS listener; Cilium / the LoadBalancer own TLS.
            - name: FUWA_K8S
              value: "true"
            - name: FUWA_SSL
              value: "false"
            # The assistant's LoadBalancer IP (192.168.0.243) is unreachable from
            # inside the cluster (no hairpin), so nginx proxies to the Service.
            - name: ASSISTANT_UPSTREAM
              value: "assistant.assistant.svc.cluster.local:8080"
            # Same story for the Argo CD panel: the 192.168.0.247 LoadBalancer
            # is not reachable from a pod, the Service is.
            - name: ARGOCD_UPSTREAM
              value: "argocd-server.argocd.svc.cluster.local:80"
            # The GPU assistant (Vulkan) that the drawer's CPU|GPU toggle selects.
            - name: ASSISTANT_GPU_UPSTREAM
              value: "assistant-e4-gpu.assistant.svc.cluster.local:8080"
            - name: LUA_CODE_CACHE
              value: "on"
            - name: FUWA_DB_PATH
              value: /app/.fuwa-dev/sqlite-local.db
            # OTLP endpoint for traces, logs, and metrics (in-namespace collector).
            # FQDN: nginx's resolver does not apply the pod search domains.
            - name: FUWA_OTLP_URL
              value: http://otel-collector.fuwa.svc.cluster.local:4318
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
