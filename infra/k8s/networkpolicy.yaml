# Allow-list for the fuwa pod. Ingress only from the LoadBalancer / cluster
# ingress; egress only to the API server (pod logs), DNS, and the observability
# namespace (OTLP traces).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fuwa
  namespace: fuwa
  labels:
    app.kubernetes.io/name: fuwa
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: fuwa
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: fuwa
            app.kubernetes.io/name: otel-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
