apiVersion: v1
kind: Service
metadata:
  name: fuwa
  namespace: fuwa
  labels:
    app.kubernetes.io/name: fuwa
spec:
  type: LoadBalancer
  # Dedicated Cilium LB IP from the lan-pool: open http://192.168.0.244/.
  loadBalancerIP: 192.168.0.244
  selector:
    app.kubernetes.io/name: fuwa
  ports:
    - name: http
      port: 80
      targetPort: http
