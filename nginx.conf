user root;
worker_processes 2;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    lua_code_cache off;
    lua_package_path "/app/?.lua;/app/?/init.lua;/app/?/?.lua;;";

    map $http_referer $signoz_api_allowed {
        default 0;
        "~^https?://[^/]+/dash/signoz/" 1;
    }

    # Shared memory for trace ring buffer and file watcher state
    lua_shared_dict traces 10m;

    # Worker init: file watcher timer
    init_worker_by_lua_file /app/runtime/openresty/init.lua;

    server {
        listen ${PORT};
        server_name localhost;

        # Root is the mounted repository
        set $root_dir /app;

        # ── /__dev/traces (GET/POST) ──
        location /__dev/traces {
            default_type application/json;
            content_by_lua_file /app/runtime/openresty/traces.lua;
        }

        # ── /__dev/traces/live SSE ──
        location /__dev/traces/live {
            content_by_lua_file /app/runtime/openresty/traces_live.lua;
        }

        # ── /__dev/containers/live SSE ──
        location /__dev/containers/live {
            content_by_lua_file /app/runtime/openresty/containers_live.lua;
        }

        # ── /__dev/deploy (POST) ──
        location /__dev/deploy {
            content_by_lua_file /app/runtime/openresty/deploy/deploy_handler.lua;
        }

        # ── Public preview routes /p/{slug}/* ──
        location /p/ {
            content_by_lua_file /app/runtime/openresty/deploy/preview_handler.lua;
        }

        # ── SigNoz dashboard (landing redirect) ──
        location = /dash/signoz/ {
            return 302 /dash/signoz/dashboards;
        }

        # ── SigNoz dashboard ──
        location /dash/signoz/ {
            proxy_pass http://signoz:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── SigNoz API (guarded to dashboard referers) ──
        location /api/ {
            if ($signoz_api_allowed = 0) {
                return 404;
            }
            rewrite ^/api/?(.*)$ /dash/signoz/api/$1 break;
            proxy_pass http://signoz:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── VictoriaMetrics ──
        location /dash/vmetrics/ {
            rewrite ^/dash/vmetrics(/.*)$ $1 break;
            proxy_pass http://victoriametrics:8428;
        }

        # ── Uptrace auto-login helper ──
        location = /uptrace-local/ {
            default_type text/html;
            content_by_lua_block {
                local credentials = string.format(
                    '{"email":"%s","password":"%s"}',
                    os.getenv("FUWA_UPTRACE_EMAIL") or "admin@uptrace.local",
                    os.getenv("FUWA_UPTRACE_PASSWORD") or "uptrace"
                )

                local sock = ngx.socket.tcp()
                sock:settimeout(2000)
                local ok, err = sock:connect("uptrace", 14318)
                if not ok then
                    ngx.status = 502
                    ngx.say("uptrace login bridge unavailable: " .. tostring(err))
                    return
                end

                local request_data = table.concat({
                    "POST /internal/v1/users/login HTTP/1.1\r\n",
                    "Host: uptrace\r\n",
                    "Content-Type: application/json\r\n",
                    "Connection: close\r\n",
                    "Content-Length: " .. tostring(#credentials) .. "\r\n\r\n",
                    credentials,
                })
                local _, send_err = sock:send(request_data)
                if send_err then
                    sock:close()
                    ngx.status = 502
                    ngx.say("uptrace login send failed: " .. tostring(send_err))
                    return
                end

                local header_buffer = ""
                while not header_buffer:find("\r\n\r\n", 1, true) do
                    local chunk, read_err, partial = sock:receive(1024)
                    local piece = chunk or partial
                    if piece and piece ~= "" then
                        header_buffer = header_buffer .. piece
                    end
                    if read_err == "closed" then
                        break
                    end
                    if read_err and read_err ~= "timeout" then
                        sock:close()
                        ngx.status = 502
                        ngx.say("uptrace login read failed: " .. tostring(read_err))
                        return
                    end
                end
                sock:close()

                local header_text = header_buffer:match("^(.-)\r\n\r\n") or header_buffer
                local cookies = {}
                for line in header_text:gmatch("[^\r\n]+") do
                    local cookie = line:match("^[Ss]et%-[Cc]ookie:%s*(.+)$")
                    if cookie then
                        cookies[#cookies + 1] = cookie
                    end
                end
                if #cookies == 0 then
                    ngx.status = 502
                    ngx.say("uptrace login bridge did not return a session cookie")
                    return
                end

                ngx.header["Set-Cookie"] = cookies
                return ngx.redirect("/dash/uptrace/")
            }
        }

        # ── Uptrace dashboard ──
        location = /dash/uptrace {
            return 302 /dash/uptrace/;
        }

        location /dash/uptrace/ {
            rewrite ^/dash/uptrace(/.*)$ $1 break;
            proxy_pass http://uptrace:14318;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── ClickHouse Play UI ──
        location /dash/clickhouse/ {
            rewrite ^/dash/clickhouse(/.*)$ $1 break;
            proxy_pass http://signoz-clickhouse:8123;
        }

        # ── Vector API ──
        location /dash/vector/ {
            rewrite ^/dash/vector(/.*)$ $1 break;
            proxy_pass http://vector-router:8686;
        }

        # ── Everything else → fuwa-dev.lua in-process ──
        location / {
            content_by_lua_file /app/runtime/openresty/handler.lua;
        }
    }
}
