user root;
worker_processes 2;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    lua_code_cache ${LUA_CODE_CACHE};
    lua_package_path "/app/?.lua;/app/?/init.lua;/app/?/?.lua;;";

    # Shared memory for trace ring buffer and file watcher state
    lua_shared_dict traces 10m;

    # Cluster DNS (k3s CoreDNS Service). Required by ngx.socket.tcp() when the
    # runtime reaches the Kubernetes API to read pod logs.
    resolver 10.43.0.10 valid=10s ipv6=off;

    # --k8s-start
    # Trust the cluster CA so cosocket TLS to kubernetes.default.svc verifies.
    lua_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
    lua_ssl_verify_depth 3;
    # --k8s-end

    # Worker init: file watcher timer
    init_worker_by_lua_file /app/runtime/openresty/init.lua;

    server {
        listen ${PORT};
        # --ssl-start
        listen 443 ssl;
        ssl_certificate     /etc/fuwa/certs/fullchain.pem;
        ssl_certificate_key /etc/fuwa/certs/privkey.pem;
        # --ssl-end
        server_name localhost;

        # Root is the mounted repository
        set $root_dir /app;

        # ── ACME HTTP-01 challenge files for Let's Encrypt ──
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        # ── /__dev/traces (GET/POST) ──
        location /__dev/traces {
            default_type application/json;
            content_by_lua_file /app/runtime/openresty/traces.lua;
        }

        # ── /__dev/traces/live SSE ──
        location /__dev/traces/live {
            content_by_lua_file /app/runtime/openresty/traces_live.lua;
        }

        # ── /__dev/pods/live SSE (Kubernetes pod logs) ──
        location /__dev/pods/live {
            content_by_lua_file /app/runtime/openresty/pods_live.lua;
        }

        # ── /__dev/deploy (POST) ──
        location /__dev/deploy {
            content_by_lua_file /app/runtime/openresty/deploy/deploy_handler.lua;
        }

        # ── /assistant/* → Python assistant, same-origin ──
        # Every assistant route is reachable under /assistant/ with the prefix
        # stripped, so the shell renders the assistant's own HTML instead of
        # re-implementing it:
        #   GET  /                 the assistant UI
        #   GET  /healthz          liveness
        #   GET  /metrics          Prometheus (per-LLM-stage)
        #   POST /ui/message       HTML fragment for the chat thread
        #   POST /chat             one-shot JSON reply
        #   POST /investigate      plan → fan-out → correlate JSON (+ facts)
        #   POST /plan             planner debug (qwen|laya)
        #   POST /speak            Kokoro TTS → audio/wav
        #   POST /voice/transcribe STT (501 unless STT_URL)
        #   GET  /actions          tool catalog + pending confirmations
        #   POST /actions/request  mint a confirmation token
        #   POST /actions/confirm  execute a confirmed action
        #   GET  /audio/{id}       202 while synthesizing, 200 when ready
        location = /assistant {
            return 302 /assistant/;
        }

        location /assistant/ {
            # The assistant is a LoadBalancer on the LAN; a pod cannot hairpin to
            # that LB IP, so in-cluster this is the Service DNS name. The value
            # is substituted at container start (ASSISTANT_UPSTREAM, defaulting
            # to the LAN address used by docker-compose).
            set $assistant_upstream "${ASSISTANT_UPSTREAM}";
            # A variable in proxy_pass disables nginx's prefix replacement, so
            # /assistant/X would reach the assistant as /assistant/X and fall
            # into its GET-only catch-all (405 on POST). Strip the prefix here.
            rewrite ^/assistant/?(.*)$ /$1 break;
            proxy_pass http://$assistant_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # /investigate runs a multi-step tool loop (~150 s); /audio/{id}
            # answers 202 while Kokoro synthesizes.
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;

            # The embedded page (fallback UI) calls absolute paths; inside
            # /assistant/ those would hit fuwa's root, so point them back here.
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter 'fetch("/ui/message"' 'fetch("/assistant/ui/message"';
            sub_filter 'fetch("/speak"' 'fetch("/assistant/speak"';
            sub_filter 'data-audio="/audio/' 'data-audio="/assistant/audio/';
        }

        # ── /assistant-gpu/* → the GPU assistant, same contract ──
        # Same proxy shape as /assistant/, pointed at assistant-e4-gpu, so the
        # drawer can switch which assistant answers without touching its code.
        location = /assistant-gpu {
            return 302 /assistant-gpu/;
        }

        location /assistant-gpu/ {
            set $assistant_gpu_upstream "${ASSISTANT_GPU_UPSTREAM}";
            rewrite ^/assistant-gpu/?(.*)$ /$1 break;
            proxy_pass http://$assistant_gpu_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;

            # Embedded-page fallback: point its absolute calls at this prefix.
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter 'fetch("/ui/message"' 'fetch("/assistant-gpu/ui/message"';
            sub_filter 'fetch("/speak"' 'fetch("/assistant-gpu/speak"';
            sub_filter 'data-audio="/audio/' 'data-audio="/assistant-gpu/audio/';
        }

        # ── /kargo/* → Kargo, same-origin so the panel keeps one origin ──
        location = /kargo {
            return 302 /kargo/;
        }

        location /kargo/ {
            set $kargo_upstream "${KARGO_UPSTREAM}";
            rewrite ^/kargo/?(.*)$ /$1 break;
            proxy_pass http://$kargo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_types text/html;
            sub_filter_once on;
            # Kargo's dashboard handler emits two matching placeholders: <base href>
            # with a trailing slash, and window.__KARGO_BASE_PATH__ without one. Its
            # React Router basename, its REST baseUrl and its redirects all read the
            # global, so rewriting only the <base> tag leaves the app navigating to
            # "/" — which is fuwa, not Kargo — and the panel renders empty.
            sub_filter '<base href="/" />' '<base href="/kargo/" />';
            sub_filter '<base href="/">' '<base href="/kargo/">';
            sub_filter "window.__KARGO_BASE_PATH__ = '';" "window.__KARGO_BASE_PATH__ = '/kargo';";
            proxy_read_timeout 120s;
        }

        # Kargo's UI calls absolute /v1beta1; behind the prefix those would hit
        # fuwa's root, so they are proxied here.
        location /v1beta1/ {
            set $kargo_upstream "${KARGO_UPSTREAM}";
            proxy_pass http://$kargo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        # ── /argocd/* → Argo CD, so its UI can live in a fuwa panel ──
        # Argo refuses framing (X-Frame-Options: sameorigin and
        # CSP frame-ancestors 'self'), and its page hardcodes <base href="/">.
        # Dropping the headers and rewriting the base makes it embeddable here;
        # its bundle calls absolute /api/v1, proxied below.
        location = /argocd {
            return 302 /argocd/;
        }

        location /argocd/ {
            set $argocd_upstream "${ARGOCD_UPSTREAM}";
            rewrite ^/argocd/?(.*)$ /$1 break;
            proxy_pass http://$argocd_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_types text/html;
            sub_filter_once on;
            sub_filter '<base href="/">' '<base href="/argocd/">';
            proxy_read_timeout 120s;
        }

        location /api/ {
            set $argocd_upstream "${ARGOCD_UPSTREAM}";
            proxy_pass http://$argocd_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_read_timeout 120s;
        }

        # ── Public preview routes /p/{slug}/* ──
        location /p/ {
            content_by_lua_file /app/runtime/openresty/deploy/preview_handler.lua;
        }

        # ── Everything else → fuwa-dev.lua in-process ──
        location / {
            content_by_lua_file /app/runtime/openresty/handler.lua;
        }
    }
}
