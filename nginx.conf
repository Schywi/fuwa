user root;
worker_processes 2;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    lua_code_cache ${LUA_CODE_CACHE};
    lua_package_path "/app/?.lua;/app/?/init.lua;/app/?/?.lua;;";

    map $http_referer $signoz_api_allowed {
        default 0;
        "~^https?://[^/]+/dash/signoz/" 1;
    }

    # Shared memory for trace ring buffer and file watcher state
    lua_shared_dict traces 10m;

    # Docker embedded DNS — required for ngx.socket.tcp() in timer callbacks
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Worker init: file watcher timer
    init_worker_by_lua_file /app/runtime/openresty/init.lua;

    server {
        listen ${PORT};
        listen 443 ssl;
        ssl_certificate     /etc/fuwa/certs/fullchain.pem;
        ssl_certificate_key /etc/fuwa/certs/privkey.pem;
        server_name localhost;

        # Root is the mounted repository
        set $root_dir /app;

        # ── ACME HTTP-01 challenge files for Let's Encrypt ──
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        # ── /__dev/traces (GET/POST) ──
        location /__dev/traces {
            default_type application/json;
            content_by_lua_file /app/runtime/openresty/traces.lua;
        }

        # ── /__dev/traces/live SSE ──
        location /__dev/traces/live {
            content_by_lua_file /app/runtime/openresty/traces_live.lua;
        }

        # ── /__dev/containers/live SSE ──
        location /__dev/containers/live {
            content_by_lua_file /app/runtime/openresty/containers_live.lua;
        }

        # ── /__dev/deploy (POST) ──
        location /__dev/deploy {
            content_by_lua_file /app/runtime/openresty/deploy/deploy_handler.lua;
        }

        # ── Public preview routes /p/{slug}/* ──
        location /p/ {
            content_by_lua_file /app/runtime/openresty/deploy/preview_handler.lua;
        }

        # ── SigNoz dashboard (landing redirect) ──
        location = /dash/signoz/ {
            return 302 /dash/signoz/dashboards;
        }

        # ── SigNoz dashboard ──
        location /dash/signoz/ {
            set $signoz_upstream signoz:8080;
            proxy_pass http://$signoz_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── SigNoz API (guarded to dashboard referers) ──
        location /api/ {
            if ($signoz_api_allowed = 0) {
                return 404;
            }
            rewrite ^/api/?(.*)$ /dash/signoz/api/$1 break;
            set $signoz_upstream signoz:8080;
            proxy_pass http://$signoz_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── VictoriaMetrics ──
        location /dash/vmetrics/ {
            set $vm_upstream victoriametrics:8428;
            rewrite ^/dash/vmetrics(/.*)$ $1 break;
            proxy_pass $scheme://$vm_upstream$uri$is_args$args;
        }

        # ── ClickHouse Play UI ──
        location /dash/clickhouse/ {
            set $ch_upstream signoz-clickhouse:8123;
            rewrite ^/dash/clickhouse(/.*)$ $1 break;
            proxy_pass $scheme://$ch_upstream$uri$is_args$args;
        }

        # ── Vector API ──
        location /dash/vector/ {
            set $vec_upstream vector-router:8686;
            rewrite ^/dash/vector(/.*)$ $1 break;
            proxy_pass $scheme://$vec_upstream$uri$is_args$args;
        }

        # ── Everything else → fuwa-dev.lua in-process ──
        location / {
            content_by_lua_file /app/runtime/openresty/handler.lua;
        }
    }
}
